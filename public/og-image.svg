<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEF3C7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Логотип (увеличенный) -->
  <g transform="translate(150, 200) scale(3)">
    <!-- Квадрат с закругленными углами -->
    <rect x="4" y="4" width="56" height="56" rx="12" ry="12" 
          fill="#ffffff" 
          stroke="#e26e2e" 
          stroke-width="3"/>
    
    <!-- Христианский крест -->
    <line x1="32" y1="18" x2="32" y2="46" 
          stroke="#e26e2e" 
          stroke-width="4" 
          stroke-linecap="round"/>
    
    <line x1="22" y1="28" x2="42" y2="28" 
          stroke="#e26e2e" 
          stroke-width="4" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Название -->
  <text x="420" y="320" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="80" 
        font-weight="700"
        fill="#1F2937"
        letter-spacing="-2">
    Школа Молитвы
  </text>
  
  <!-- Описание -->
  <text x="420" y="380" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="36" 
        font-weight="400"
        fill="#6B7280">
    Интерактивное обучение молитвенной жизни
  </text>
  
  <!-- URL -->
  <text x="420" y="440" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="28" 
        font-weight="500"
        fill="#e26e2e">
    shkola-molitvy.ru
  </text>
</svg>
