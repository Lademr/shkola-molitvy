<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60">
  <!-- Иконка: стилизованная книга с крестом (моно-линейная) -->
  <g transform="translate(10, 10)">
    <!-- Левая страница книги -->
    <path d="M 0,5 Q 0,0 5,0 L 18,0 Q 20,0 20,2 L 20,38 Q 20,40 18,40 L 5,40 Q 0,40 0,35 Z" 
          fill="none" 
          stroke="#F59E0B" 
          stroke-width="2.5"
          stroke-linejoin="round"/>
    
    <!-- Правая страница книги -->
    <path d="M 40,5 Q 40,0 35,0 L 22,0 Q 20,0 20,2 L 20,38 Q 20,40 22,40 L 35,40 Q 40,40 40,35 Z" 
          fill="none" 
          stroke="#F59E0B" 
          stroke-width="2.5"
          stroke-linejoin="round"/>
    
    <!-- Корешок книги -->
    <line x1="20" y1="0" x2="20" y2="40" 
          stroke="#F59E0B" 
          stroke-width="2.5"/>
    
    <!-- Крест на книге -->
    <line x1="20" y1="12" x2="20" y2="28" 
          stroke="#F59E0B" 
          stroke-width="2.5"
          stroke-linecap="round"/>
    <line x1="14" y1="18" x2="26" y2="18" 
          stroke="#F59E0B" 
          stroke-width="2.5"
          stroke-linecap="round"/>
    
    <!-- Линии текста на левой странице -->
    <line x1="4" y1="8" x2="16" y2="8" 
          stroke="#F59E0B" 
          stroke-width="1.5"
          opacity="0.4"
          stroke-linecap="round"/>
    <line x1="4" y1="12" x2="14" y2="12" 
          stroke="#F59E0B" 
          stroke-width="1.5"
          opacity="0.4"
          stroke-linecap="round"/>
    <line x1="4" y1="32" x2="16" y2="32" 
          stroke="#F59E0B" 
          stroke-width="1.5"
          opacity="0.4"
          stroke-linecap="round"/>
    <line x1="4" y1="36" x2="12" y2="36" 
          stroke="#F59E0B" 
          stroke-width="1.5"
          opacity="0.4"
          stroke-linecap="round"/>
    
    <!-- Линии текста на правой странице -->
    <line x1="24" y1="8" x2="36" y2="8" 
          stroke="#F59E0B" 
          stroke-width="1.5"
          opacity="0.4"
          stroke-linecap="round"/>
    <line x1="26" y1="12" x2="36" y2="12" 
          stroke="#F59E0B" 
          stroke-width="1.5"
          opacity="0.4"
          stroke-linecap="round"/>
    <line x1="24" y1="32" x2="36" y2="32" 
          stroke="#F59E0B" 
          stroke-width="1.5"
          opacity="0.4"
          stroke-linecap="round"/>
    <line x1="28" y1="36" x2="36" y2="36" 
          stroke="#F59E0B" 
          stroke-width="1.5"
          opacity="0.4"
          stroke-linecap="round"/>
  </g>
  
  <!-- Текст "Школа Молитвы" -->
  <text x="65" y="38" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="28" 
        font-weight="700"
        fill="#1F2937"
        letter-spacing="-0.5">
    Школа Молитвы
  </text>
</svg>
