<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#gold)"/>
  
  <!-- Simplified dove -->
  <g transform="translate(16, 12)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="6" ry="4" fill="white"/>
    <!-- Head -->
    <circle cx="5" cy="-2" r="3" fill="white"/>
    <!-- Beak -->
    <path d="M 7.5,-2 L 10,-2.5 L 7.5,-1.5 Z" fill="#FF8C00"/>
    <!-- Wing -->
    <path d="M -3,-1 Q -8,-5 -10,-3 Q -8,-1 -5,0 Z" fill="white"/>
  </g>
  
  <!-- Book -->
  <g transform="translate(16, 22)">
    <rect x="-6" y="-3" width="5" height="6" fill="white" stroke="#FF8C00" stroke-width="0.5"/>
    <rect x="1" y="-3" width="5" height="6" fill="white" stroke="#FF8C00" stroke-width="0.5"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#FF8C00" stroke-width="1"/>
  </g>
</svg>
