<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Квадрат с закругленными углами -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" 
        fill="#ffffff" 
        stroke="#e26e2e" 
        stroke-width="3"/>
  
  <!-- Христианский крест (не православный) -->
  <!-- Вертикальная линия -->
  <line x1="32" y1="18" x2="32" y2="46" 
        stroke="#e26e2e" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <!-- Горизонтальная линия (чуть выше центра - христианский крест) -->
  <line x1="22" y1="28" x2="42" y2="28" 
        stroke="#e26e2e" 
        stroke-width="4" 
        stroke-linecap="round"/>
</svg>
