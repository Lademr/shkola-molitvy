<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#goldGradient)" opacity="0.1"/>
  
  <!-- Open book -->
  <g transform="translate(256, 320)">
    <!-- Left page -->
    <path d="M -80,0 L -80,-60 Q -80,-70 -70,-70 L -10,-70 Q 0,-70 0,-60 L 0,0 Q 0,10 -10,10 L -70,10 Q -80,10 -80,0 Z" 
          fill="url(#bookGradient)" stroke="#FFA500" stroke-width="3"/>
    <!-- Right page -->
    <path d="M 80,0 L 80,-60 Q 80,-70 70,-70 L 10,-70 Q 0,-70 0,-60 L 0,0 Q 0,10 10,10 L 70,10 Q 80,10 80,0 Z" 
          fill="url(#bookGradient)" stroke="#FFA500" stroke-width="3"/>
    <!-- Book spine -->
    <line x1="0" y1="-70" x2="0" y2="10" stroke="#FFA500" stroke-width="4"/>
    <!-- Page lines left -->
    <line x1="-65" y1="-55" x2="-15" y2="-55" stroke="#FFA500" stroke-width="1.5" opacity="0.5"/>
    <line x1="-65" y1="-45" x2="-15" y2="-45" stroke="#FFA500" stroke-width="1.5" opacity="0.5"/>
    <line x1="-65" y1="-35" x2="-15" y2="-35" stroke="#FFA500" stroke-width="1.5" opacity="0.5"/>
    <!-- Page lines right -->
    <line x1="65" y1="-55" x2="15" y2="-55" stroke="#FFA500" stroke-width="1.5" opacity="0.5"/>
    <line x1="65" y1="-45" x2="15" y2="-45" stroke="#FFA500" stroke-width="1.5" opacity="0.5"/>
    <line x1="65" y1="-35" x2="15" y2="-35" stroke="#FFA500" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Dove -->
  <g transform="translate(256, 200)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="45" ry="35" fill="white" stroke="#FFA500" stroke-width="2"/>
    
    <!-- Head -->
    <circle cx="35" cy="-15" r="22" fill="white" stroke="#FFA500" stroke-width="2"/>
    
    <!-- Beak -->
    <path d="M 55,-15 L 70,-18 L 55,-12 Z" fill="#FFA500"/>
    
    <!-- Eye -->
    <circle cx="42" cy="-18" r="3" fill="#333"/>
    
    <!-- Left wing -->
    <path d="M -20,-10 Q -60,-40 -80,-20 Q -70,-10 -40,-5 Z" 
          fill="white" stroke="#FFA500" stroke-width="2"/>
    <path d="M -40,-5 Q -50,-15 -60,-10" fill="none" stroke="#FFA500" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Right wing (raised) -->
    <path d="M 20,-10 Q 50,-50 70,-35 Q 60,-20 35,-15 Z" 
          fill="white" stroke="#FFA500" stroke-width="2"/>
    <path d="M 35,-15 Q 45,-30 55,-25" fill="none" stroke="#FFA500" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Tail -->
    <path d="M -40,10 Q -60,20 -70,15 Q -65,5 -45,5 Z" 
          fill="white" stroke="#FFA500" stroke-width="2"/>
    
    <!-- Olive branch -->
    <g transform="translate(65, -5)">
      <path d="M 0,0 Q 10,5 20,3" fill="none" stroke="#4A7C59" stroke-width="2"/>
      <ellipse cx="8" cy="2" rx="4" ry="6" fill="#6B9F7D" transform="rotate(-20 8 2)"/>
      <ellipse cx="15" cy="4" rx="4" ry="6" fill="#6B9F7D" transform="rotate(10 15 4)"/>
    </g>
  </g>
  
  <!-- Light rays -->
  <g opacity="0.3">
    <line x1="256" y1="100" x2="256" y2="60" stroke="url(#goldGradient)" stroke-width="3"/>
    <line x1="200" y1="120" x2="180" y2="90" stroke="url(#goldGradient)" stroke-width="3"/>
    <line x1="312" y1="120" x2="332" y2="90" stroke="url(#goldGradient)" stroke-width="3"/>
  </g>
</svg>
